# Render Blueprint — connect at https://dashboard.render.com/blueprints
services:
  - type: web
    name: pro-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    # Single worker so in-process alert scanners stay continuous
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    # Instant path — free tier cold starts must answer <5s or Render kills the instance
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: SECRET_KEY
        generateValue: true
      - key: PRO_TRADER_BG
        value: "1"
      - key: TRADE_ALERTS_ENABLED
        value: "true"
      - key: ALERT_PRECISION_MODE
        value: "true"
      - key: ALERT_MIN_GRADE
        value: "B"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: MYFXBOOK_EMAIL
        sync: false
      - key: MYFXBOOK_PASSWORD
        sync: false
      - key: MYFXBOOK_ACCOUNT_ID
        sync: false
      - key: MYFXBOOK_AUTO_SYNC
        value: "true"

  # Keep free-tier instance awake so Telegram scanners keep running
  - type: cron
    name: pro-trader-keepalive
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://pro-trader-fjrc.onrender.com/health', timeout=90).read(); print('keepalive ok')"